[package]
name = "resizer-core"
version = "1.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.130"
console_error_panic_hook = { version = "0.1.7", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
debug = false
